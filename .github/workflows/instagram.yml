name: Publish to Instagram

# Каждые 30 минут с 9:20 до 12:50 и с 17:20 до 20:50 по Москве — после публикации
# в Telegram (9:00 и 17:00). GitHub часто пропускает или задерживает запуски по
# расписанию на несколько часов, поэтому окно широкое. Лишний запуск безопасен:
# если новой обложки нет или пост уже опубликован, скрипт ничего не делает.
on:
  schedule:
    - cron: "20,50 6-9,14-17 * * *"
  workflow_dispatch:
  # Ручной запуск без вкладки Actions: изменить файл .github/instagram-run
  push:
    paths: [".github/instagram-run"]

permissions:
  contents: write

concurrency:
  group: instagram
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      # ref: main — свежий main, а не коммит на момент запуска: иначе второй
      # запуск из очереди не видит, что первый уже опубликовал пост, и дублирует его
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish next post
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
        run: python3 scripts/instagram_publish.py
      - name: Save published list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          [ -f instagram_posted.json ] || exit 0
          git add instagram_posted.json
          git diff --cached --quiet && exit 0
          git commit -m "Instagram: опубликован пост"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && break; sleep 5; done
