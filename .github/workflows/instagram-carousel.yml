name: Instagram carousel (one-off)

on:
  push:
    paths: [".github/instagram-carousel"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish carousel
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_API_HOST: ${{ vars.IG_API_HOST }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
        run: python3 scripts/instagram_carousel.py
