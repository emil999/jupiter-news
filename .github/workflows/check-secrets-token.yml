name: Check GH_SECRETS_TOKEN

# Проверка, что токен для автопродления ключа Instagram может записывать секреты.
# Запускается изменением файла .github/check-secrets-token. Сам токен в лог не выводится.
on:
  push:
    paths: [".github/check-secrets-token"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check token
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::error::Секрет GH_SECRETS_TOKEN не найден"; exit 1; fi
          if gh api "repos/$GITHUB_REPOSITORY/actions/secrets/public-key" --jq .key_id >/dev/null 2>&1; then
            echo "::notice::GH_SECRETS_TOKEN работает: доступ к секретам репозитория есть"
          else
            echo "::error::GH_SECRETS_TOKEN не даёт доступа к секретам — проверьте репозиторий и право Secrets: Read and write"; exit 1
          fi
